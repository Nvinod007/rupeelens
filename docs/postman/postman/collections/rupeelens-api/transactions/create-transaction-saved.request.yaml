$kind: http-request
name: Create transaction (saved)
method: POST
url: '{{apiBaseUrl}}/transactions'
order: 2000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Postman test lunch",
      "amount": 250,
      "status": "saved",
      "category": "Food & Dining",
      "notes": "Created from Postman"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 201 || pm.response.code === 200) {
        const j = pm.response.json();
        if (j.id) pm.environment.set('transactionId', j.id);
      }
