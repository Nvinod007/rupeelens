$kind: http-request
name: List categories
method: GET
url: '{{apiBaseUrl}}/categories'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 200) {
        const list = pm.response.json();
        if (Array.isArray(list) && list[0]?.id) {
          pm.environment.set('categoryId', list[0].id);
        }
      }
